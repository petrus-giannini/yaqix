<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d18">
<meta name="description" content="yaqix (yet another qix): clone del classico arcade Qix per cellulare e tablet, con pad direzionale e pulsante lento.">
<title>yaqix</title>
<!-- @artifact-start -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d18'/%3E%3Crect x='1' y='1' width='14' height='14' fill='none' stroke='%23e8ebff' stroke-width='1'/%3E%3Crect x='1.5' y='1.5' width='6' height='6' fill='%233d6ef2'/%3E%3Crect x='8.5' y='8.5' width='6' height='6' fill='%23f2a32b'/%3E%3Cpath d='M9 3l4 3M10 7l3-5' stroke='%23ff4d8a' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=Chakra+Petch:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="style.css">
<!-- @artifact-head-end -->
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="stat"><span class="lab" data-i18n="hud.score">Punti</span><b id="score">0</b></div>
    <div class="stat st-hi"><span class="lab" data-i18n="hud.best">Record</span><b id="hi">0</b></div>
    <div class="stat"><span class="lab"><span data-i18n="hud.area">Area</span><i id="pct">0,0%</i></span><div class="bar"><div id="bar"></div><span class="goal"></span></div></div>
    <div class="stat"><span class="lab" data-i18n="hud.level">Liv.</span><b id="lvl">1</b></div>
    <div class="stat"><span class="lab" data-i18n="hud.lives">Vite</span><b id="lives" class="lives">◆◆◆</b></div>
    <div class="tools">
      <button id="lang" class="lang" data-i18n-aria="aria.language" aria-label="Lingua">IT</button>
      <button id="gear" data-i18n-aria="aria.settings" aria-label="Impostazioni"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
      <button id="pause" data-i18n-aria="aria.pause" aria-label="Pausa"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10"/><rect x="9.5" y="3" width="3" height="10"/></svg></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" data-i18n-aria="aria.field" aria-label="Campo di gioco"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="overlay" id="overlay"></div>
  </main>

  <div class="padwrap">
    <div class="pad" id="pad" data-dir="" data-mode="arrows" data-i18n-aria="aria.pad" aria-label="Controllo direzionale">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g class="stick">
          <circle class="ring" cx="50" cy="50" r="48"/>
          <circle class="ring2" cx="50" cy="50" r="32"/>
          <circle class="dz" cx="50" cy="50" r="9"/>
          <path class="k k-up" d="M50 5l5 7H45z"/>
          <path class="k k-down" d="M50 95l5-7H45z"/>
          <path class="k k-left" d="M5 50l7-5v10z"/>
          <path class="k k-right" d="M95 50l-7-5v10z"/>
          <circle class="knob" id="knob" cx="50" cy="50" r="15"/>
        </g>
        <g class="arrows">
          <circle class="base" cx="50" cy="50" r="48"/>
          <rect class="arm a-up" x="35" y="6" width="30" height="33" rx="5"/>
          <rect class="arm a-down" x="35" y="61" width="30" height="33" rx="5"/>
          <rect class="arm a-left" x="6" y="35" width="33" height="30" rx="5"/>
          <rect class="arm a-right" x="61" y="35" width="33" height="30" rx="5"/>
          <circle class="hub" cx="50" cy="50" r="11"/>
          <path class="tri t-up" d="M50 13l7 10H43z"/>
          <path class="tri t-down" d="M50 87l7-10H43z"/>
          <path class="tri t-left" d="M13 50l10-7v14z"/>
          <path class="tri t-right" d="M87 50l-10-7v14z"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="btnwrap">
    <button class="slow" id="slow" data-i18n-aria="aria.slow" aria-label="Lento: traccia piano, punti doppi"><strong data-i18n="slow.label">LENTO</strong><small data-i18n="slow.hint">punti ×2</small></button>
  </div>
</div>
<!-- @artifact-body-end -->
<script src="script.js"></script>
</body>
</html>
